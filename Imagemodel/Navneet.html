<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plant Disease Analysis Portal</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #27ae60; padding-bottom: 10px; }
        
        .setup-section { display: flex; gap: 20px; margin-bottom: 20px; align-items: flex-end; flex-wrap: wrap; }
        .input-group { flex: 1; min-width: 200px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; font-size: 0.9em; }
        
        select, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
        
        button { background-color: #27ae60; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; transition: background 0.3s; width: 100%; margin-top: 10px; }
        button:hover { background-color: #219150; }
        button:disabled { background-color: #bdc3c7; cursor: not-allowed; }

        #status { text-align: center; margin-top: 15px; font-weight: bold; }
        
        .results-section { margin-top: 30px; display: none; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #f2f2f2; }
        tr:nth-child(even) { background-color: #fafafa; }
        
        .download-btn { display: inline-block; margin-top: 20px; padding: 10px 20px; background-color: #2980b9; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; }
        .download-btn:hover { background-color: #2471a3; }
    </style>
</head>
<body>
<div class="container">
    <h2>Plant Health Analysis Portal</h2>

    <div class="setup-section">
        <div class="input-group">
            <label for="modeSelect">Hardware Mode:</label>
            <select id="modeSelect">
                <option value="camera">Standard Camera</option>
                <option value="root_scanner">Root Scanner</option>
                <option value="microscope">Microscope</option>
            </select>
        </div>
        
        <div class="input-group">
            <label for="imageUpload">Upload Images (Batch):</label>
            <input type="file" id="imageUpload" multiple accept="image/*">
        </div>
    </div>

    <button id="analyzeBtn" onclick="runAnalysis()">Run predicrion & Generate Report</button>
    <div id="status"></div>

    <div id="resultsSection" class="results-section">
        <h3>Analysis Summary</h3>
        <table id="resultsTable">
            <thead>
                <tr>
                    <th>Image Name</th>
                    <th>Mode</th>
                    <th>Predicted Class</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
        <a id="downloadLink" class="download-btn" href="#" target="_blank">📥 Download Full Excel Report</a>
    </div>
</div>

<script>
    async function runAnalysis() {
        const fileInput = document.getElementById('imageUpload');
        const mode = document.getElementById('modeSelect').value;
        const btn = document.getElementById('analyzeBtn');
        const status = document.getElementById('status');
        const resultsSection = document.getElementById('resultsSection');
        const resultsBody = document.getElementById('resultsBody');
        const downloadLink = document.getElementById('downloadLink');

        if (fileInput.files.length === 0) {
            alert("Please select at least one image file.");
            return;
        }

        // Prepare UI
        btn.disabled = true;
        btn.innerText = "Analyzing images... please wait";
        status.innerText = "Processing images through CNN models...";
        status.style.color = "#2980b9";
        resultsSection.style.display = "none";

        // 1. Prepare Multipart Form Data
        const formData = new FormData();
        formData.append("mode", mode);
        for (let i = 0; i < fileInput.files.length; i++) {
            formData.append("files", fileInput.files[i]);
        }

        try {
            // 2. Call your local FastAPI server
            // Change '127.0.0.1' to the Institute Server IP later
            const response = await fetch("http://127.0.0.1:8000/predict_multimodal", {
                method: "POST",
                body: formData
            });

            if (!response.ok) throw new Error("Server error occurred.");

            const data = await response.json();

            // 3. Populate Table Results
            resultsBody.innerHTML = "";
            data.display_data.forEach(res => {
                const row = `<tr>
                    <td>${res["Image Name"]}</td>
                    <td>${res["Source"] || res["User Mode"]}</td>
                    <td><strong>${res["Predicted Class"]}</strong></td>
                    <td>${res["Predicted Score"]}</td>
                </tr>`;
                resultsBody.innerHTML += row;
            });

            // 4. Setup Download Link
            // Ensure the download link points to the full server address
            downloadLink.href = `http://127.0.0.1:8000${data.download_url}`;
            
            // 5. Success UI
            resultsSection.style.display = "block";
            status.innerText = "Analysis Complete!";
            status.style.color = "#27ae60";

        } catch (error) {
            console.error(error);
            status.innerText = "Error: " + error.message;
            status.style.color = "#c0392b";
        } finally {
            btn.disabled = false;
            btn.innerText = "Run Prediction & Generate Report";
        }
    }
</script>

</body>
</html>
